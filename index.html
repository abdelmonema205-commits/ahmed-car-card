<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, Tahoma, sans-serif;
    background: linear-gradient(145deg, #171717, #050505);
    color: white;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 25px 15px;
}

.container {
    width: 100%;
    max-width: 430px;
    text-align: center;
    background: #111;
    border: 1px solid #c5a34a;
    border-radius: 25px;
    padding: 28px 22px;
    box-shadow: 0 0 30px rgba(197,163,74,.15);
}

.logo {
    width: 105px;
    height: 105px;
    object-fit: cover;
    border-radius: 50%;
    border: 2px solid #d6b65c;
    margin-bottom: 20px;
}

.profile {
    width: 145px;
    height: 145px;
    object-fit: cover;
    border-radius: 50%;
    border: 3px solid #d6b65c;
    padding: 4px;
    margin-bottom: 15px;
}

h1 {
    color: #e5c66d;
    font-size: 27px;
    margin-bottom: 10px;
}

.subtitle {
    color: #ccc;
    font-size: 15px;
    line-height: 1.8;
    margin-bottom: 25px;
}

.links {
    display: flex;
    flex-direction: column;
    gap: 13px;
}

.btn {
    display: block;
    padding: 15px;
    border-radius: 12px;
    text-decoration: none;
    background: linear-gradient(90deg, #b7953e, #f0d98b);
    color: #111;
    font-size: 17px;
    font-weight: bold;
    transition: .3s;
}

.btn:hover {
    transform: translateY(-3px);
}

.btn.facebook {
    background: #181818;
    color: #e5c66d;
    border: 1px solid #b7953e;
}

.footer {
    margin-top: 25px;
    color: #999;
    font-size: 12px;
    line-height: 2;
}

.footer strong {
    color: #d6b65c;
    letter-spacing: 2px;
}
</style>
</head>

<body>

<div class="container">

    <!-- LINKORA LOGO -->

    <div class="links">

        <a class="btn" href="tel:01090041986">
